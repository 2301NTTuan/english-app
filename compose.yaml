services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: english_mastery
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english
    ports:
      - "5432:5432"
    volumes:
      - english_mastery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english_mastery"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  english_mastery_postgres:
