name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: english_mastery_test
          POSTGRES_USER: english
          POSTGRES_PASSWORD: english
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U english -d english_mastery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://english:english@localhost:5432/english_mastery_test
      TEST_DATABASE_URL: postgresql://english:english@localhost:5432/english_mastery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
